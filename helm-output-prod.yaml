# Source: gati/templates/deployment-ingress.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gati-ingress
  namespace: gati-production
  labels:
    app.kubernetes.io/name: gati-ingress
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gati-ingress
      app.kubernetes.io/component: ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gati-ingress
        app.kubernetes.io/component: ingress
    spec:
      serviceAccountName: gati-ingress
      containers:
      - name: ingress
        image: "gati/ingress:0.4.5"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: gati-ingress-config
        resources:
          limits:
            cpu: 2000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: gati-ingress
              topologyKey: topology.kubernetes.io/zone
            weight: 100
---
