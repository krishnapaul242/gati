# Source: gati/templates/scaledobject-ingress.yaml
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: gati-ingress
  namespace: gati-dev
  labels:
    app.kubernetes.io/name: gati-ingress
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: Helm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gati-ingress
  minReplicaCount: 0
  maxReplicaCount: 5
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus-server:9090
      metricName: http_requests_per_second
      query: |
        sum(rate(http_requests_total{service="gati-ingress"}[1m]))
      threshold: "100"
