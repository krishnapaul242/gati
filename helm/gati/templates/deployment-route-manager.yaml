{{- if .Values.routeManager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gati-route-manager
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: gati-route-manager
    app.kubernetes.io/component: route-manager
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.routeManager.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gati-route-manager
      app.kubernetes.io/component: route-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gati-route-manager
        app.kubernetes.io/component: route-manager
        {{- with .Values.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.rbac.create }}
      serviceAccountName: gati-route-manager
      {{- end }}
      containers:
      - name: route-manager
        image: "{{ .Values.routeManager.image.repository }}:{{ .Values.routeManager.image.tag }}"
        imagePullPolicy: {{ .Values.routeManager.image.pullPolicy }}
        ports:
        - name: grpc
          containerPort: {{ .Values.routeManager.service.port }}
          protocol: TCP
        resources:
          {{- toYaml .Values.routeManager.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
