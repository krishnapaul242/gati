{{- if .Values.rbac.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gati-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: gati-ingress
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gati-route-manager
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: gati-route-manager
    app.kubernetes.io/component: route-manager
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gati
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: gati
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gati-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: gati-ingress
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gati
subjects:
- kind: ServiceAccount
  name: gati-ingress
  namespace: {{ .Values.global.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gati-route-manager
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: gati-route-manager
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gati
subjects:
- kind: ServiceAccount
  name: gati-route-manager
  namespace: {{ .Values.global.namespace }}
{{- end }}
