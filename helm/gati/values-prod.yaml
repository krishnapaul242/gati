# Production environment configuration
global:
  namespace: gati-production

ingress:
  enabled: true
  replicaCount: 3
  image:
    repository: gati/ingress
    tag: "0.4.5"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi
  config:
    ROUTE_MANAGER_ADDR: "gati-route-manager:50051"
    TIMESCAPE_ADDR: "timescape:50052"
    FEATURE_PLAYGROUND: "false"
    LOG_LEVEL: "warn"

routeManager:
  enabled: true
  replicaCount: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60

keda:
  enabled: false

serviceMonitor:
  enabled: true

pdb:
  enabled: true
  minAvailable: 2

multiZone:
  enabled: true
  zones:
    - us-east-1a
    - us-east-1b
    - us-east-1c

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: gati-ingress
        topologyKey: topology.kubernetes.io/zone
